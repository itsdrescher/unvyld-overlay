<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>UNVYLD Socials</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,800;1,900&family=Inter:wght@700;800&display=swap" rel="stylesheet">
<script src="fitness-config.js"></script>
<style>
  /* Werbe-Karte: blendet dezent ein (0 → 100 %), bleibt kurz, wird kleiner und verschwindet.
     Größe passt sich der OBS-Quelle an (empfohlen 520 × 110). */
  :root { --volt: #d4ff1e; --ink: #0c0d0f; --white: #f5f6f2; --muted: #9aa0a6; --daytona: #4a4f55;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body.preview { background: #2b2f3a; }
  #card { position: absolute; inset: 6% 2%; display: flex; align-items: center; gap: 8vh;
    background: rgba(12,13,15,.9); border-left: 4vh solid var(--volt); padding: 0 12vh 0 7vh;
    clip-path: polygon(0 0, 100% 0, calc(100% - 6vh) 100%, 0 100%);
    opacity: 0; transform: scale(.85); transform-origin: left center; }
  .ic { flex: none; width: 58vh; height: 58vh; display: grid; place-items: center; background: var(--volt);
    clip-path: polygon(8vh 0, 100% 0, calc(100% - 8vh) 100%, 0 100%); }
  .ic svg { width: 58%; height: 58%; }
  .ic .v { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 50vh; color: var(--ink); line-height: 1; }
  .txt { min-width: 0; }
  .label { font-family: Inter, sans-serif; font-weight: 800; font-size: 15vh; letter-spacing: 1.2vh; color: var(--muted); text-transform: uppercase; white-space: nowrap; }
  .handle { font-family: var(--display); font-style: italic; font-weight: 900; font-size: 38vh; line-height: 1.05; color: var(--white); white-space: nowrap; }
  .sub { font-family: Inter, sans-serif; font-weight: 700; font-size: 13vh; color: var(--volt); white-space: nowrap; margin-top: .6vh; }
  .sub:empty { display: none; }
</style>
</head>
<body>
<div id="card">
  <div class="ic" id="ic"></div>
  <div class="txt">
    <div class="label" id="label"></div>
    <div class="handle" id="handle"></div>
    <div class="sub" id="sub"></div>
  </div>
</div>
<script>
(() => {
  const C = (typeof CONFIG !== "undefined") ? CONFIG : {};
  const S = Object.assign({ everySec: 45, showSec: 8, items: [] }, C.socials || {});
  const test = new URLSearchParams(location.search).has("test");
  if (test) S.everySec = 12;
  if (!window.obsstudio) document.body.classList.add("preview");

  // Einfache, neutrale Symbole (keine Marken-Logos)
  const ICONS = {
    insta:   '<svg viewBox="0 0 24 24" fill="none" stroke="#0c0d0f" stroke-width="2.4"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="1.2" fill="#0c0d0f" stroke="none"/></svg>',
    tiktok:  '<svg viewBox="0 0 24 24" fill="#0c0d0f"><path d="M14 3h3c.3 2.2 1.8 3.7 4 4v3c-1.6 0-3-.5-4-1.3V15a6 6 0 1 1-6-6v3.2a2.8 2.8 0 1 0 3 2.8V3z"/></svg>',
    youtube: '<svg viewBox="0 0 24 24" fill="#0c0d0f"><rect x="2" y="5" width="20" height="14" rx="4"/><path d="M10 9l5 3-5 3z" fill="#d4ff1e"/></svg>',
    twitch:  '<svg viewBox="0 0 24 24" fill="none" stroke="#0c0d0f" stroke-width="2.4"><path d="M4 3h16v11l-4 4h-4l-3 3v-3H4z"/><path d="M11 8v4M15 8v4"/></svg>',
    web:     '<svg viewBox="0 0 24 24" fill="none" stroke="#0c0d0f" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>',
  };

  const card = document.getElementById("card");
  const items = S.items.filter(Boolean);
  if (!items.length) return;
  let i = 0, busy = false;

  function fill(it) {
    document.getElementById("ic").innerHTML = it.icon === "app" ? '<span class="v">V</span>' : (ICONS[it.icon] || ICONS.web);
    document.getElementById("label").textContent = it.label || "";
    document.getElementById("handle").textContent = it.handle || "";
    document.getElementById("sub").textContent = it.sub || "";
  }

  async function showNext() {
    if (busy) return; busy = true;
    fill(items[i % items.length]); i++;
    await card.animate([{ opacity: 0, transform: "scale(.85)" }, { opacity: 1, transform: "scale(1)" }],
      { duration: 1200, easing: "cubic-bezier(.2,.8,.2,1)", fill: "forwards" }).finished;
    await new Promise(r => setTimeout(r, Math.max(1, S.showSec - 2.4) * 1000));
    await card.animate([{ opacity: 1, transform: "scale(1)" }, { opacity: 0, transform: "scale(.85)" }],
      { duration: 1200, easing: "cubic-bezier(.6,0,.8,.4)", fill: "forwards" }).finished;
    busy = false;
  }
  setTimeout(showNext, 2000);
  setInterval(showNext, S.everySec * 1000);
})();
</script>
</body>
</html>
